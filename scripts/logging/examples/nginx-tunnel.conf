# Include in nginx's http {} context. Alternative to Caddyfile-tunnel.
# ONLY local cloudflared may reach this listener. Never expose it publicly.
map $http_upgrade $screentinker_connection {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:8080;
    server_name signage.example.com;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # realip restores the trusted tunnel header into $remote_addr.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $screentinker_connection;
        proxy_read_timeout 300s;
    }
}
