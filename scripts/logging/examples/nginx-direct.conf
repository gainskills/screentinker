# Include in nginx's http {} context. Replace hostname and certificate paths.
# Public clients connect directly to this nginx; no CDN/tunnel is in front.
map $http_upgrade $screentinker_connection {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name signage.example.com;
    ssl_certificate /etc/letsencrypt/live/signage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signage.example.com/privkey.pem;
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite client-supplied forwarding headers at this public boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $screentinker_connection;
        proxy_read_timeout 300s;
    }
}
